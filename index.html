<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY WISHLIST</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f0df;
  color:#304638;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:35px 18px 60px;
}

header{
  text-align:center;
  margin-bottom:25px;
}

header h1{
  margin:0;
  font-size:38px;
  letter-spacing:3px;
  color:#315b43;
}

header p{
  color:#718274;
  margin-top:8px;
}

.card{
  background:#fffdf5;
  border-radius:28px;
  padding:24px;
  box-shadow:0 6px 20px rgba(48,70,56,.08);
  margin-bottom:25px;
}

.money-title{
  font-size:17px;
  font-weight:bold;
}

.money-number{
  font-size:32px;
  font-weight:bold;
  margin:8px 0 15px;
  color:#315b43;
}

input{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:1px solid #d8dfd2;
  border-radius:14px;
  background:#faf9ef;
  font-size:15px;
}

.progress{
  height:12px;
  background:#e3e8dc;
  border-radius:20px;
  overflow:hidden;
  margin-top:15px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#719b78;
  transition:.3s;
}

.small{
  color:#879287;
  font-size:13px;
  margin-top:8px;
}

h2{
  color:#315b43;
  margin:30px 5px 15px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.category{
  border:0;
  background:#fffdf5;
  color:#304638;
  border-radius:25px;
  padding:25px 8px;
  font-size:16px;
  box-shadow:0 5px 17px rgba(48,70,56,.07);
  cursor:pointer;
}

.category span{
  display:block;
  font-size:35px;
  margin-bottom:8px;
}

.category:active{
  transform:scale(.97);
}

.selected{
  background:#dce9d9;
}

#items{
  margin-top:25px;
}

.item{
  background:#fffdf5;
  border-radius:25px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 17px rgba(48,70,56,.07);
}

.item img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:12px;
}

.item h3{
  margin:5px 0;
  color:#315b43;
}

.item p{
  margin:7px 0;
  color:#718274;
}

.done{
  opacity:.5;
  text-decoration:line-through;
}

button.action{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  margin:7px 5px 0 0;
  background:#e5ecdf;
  color:#304638;
  cursor:pointer;
}

button.delete{
  background:#eee9dc;
}

.add{
  background:#719b78 !important;
  color:white !important;
}

.empty{
  text-align:center;
  color:#879287;
  padding:25px;
}

@media(max-width:600px){
  .categories{
    grid-template-columns:repeat(2,1fr);
  }

  header h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>MY WISHLIST</h1>
  <p>사고 싶은 것들을 모아두는 곳 🛒</p>
</header>

<div class="card">
  <div class="money-title">💰 현재 모은 돈</div>
  <div class="money-number" id="money">0원</div>

  <input id="moneyInput" type="number" placeholder="현재 모은 돈">
  <input id="targetInput" type="number" placeholder="목표 금액">

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div class="small" id="targetText">목표 금액: 0원</div>
</div>

<h2>WISHLIST</h2>

<div class="categories">

<button class="category" onclick="selectCategory('애니메이션',this)">
<span>🎬</span>애니메이션
</button>

<button class="category" onclick="selectCategory('아이돌',this)">
<span>🎤</span>아이돌
</button>

<button class="category" onclick="selectCategory('책',this)">
<span>📚</span>책
</button>

<button class="category" onclick="selectCategory('신발',this)">
<span>👟</span>신발
</button>

<button class="category" onclick="selectCategory('옷',this)">
<span>👕</span>옷
</button>

<button class="category" onclick="selectCategory('장난감',this)">
<span>🧸</span>장난감
</button>

</div>

<div id="items"></div>

</div>

<script>

let items=JSON.parse(localStorage.getItem("myWishlist"))||[];
let currentCategory=null;

const moneyInput=document.getElementById("moneyInput");
const targetInput=document.getElementById("targetInput");

moneyInput.value=localStorage.getItem("money")||"";
targetInput.value=localStorage.getItem("target")||"";

function updateMoney(){

  let money=Number(moneyInput.value)||0;
  let target=Number(targetInput.value)||0;

  localStorage.setItem("money",money);
  localStorage.setItem("target",target);

  document.getElementById("money").textContent=
    money.toLocaleString()+"원";

  document.getElementById("targetText").textContent=
    "목표 금액: "+target.toLocaleString()+"원";

  let percent=target ? Math.min(money/target*100,100):0;

  document.getElementById("bar").style.width=percent+"%";
}

moneyInput.addEventListener("input",updateMoney);
targetInput.addEventListener("input",updateMoney);

function selectCategory(category,button){

  currentCategory=category;

  document.querySelectorAll(".category")
    .forEach(b=>b.classList.remove("selected"));

  button.classList.add("selected");

  showItems();
}

function addItem(){

  if(!currentCategory){
    alert("먼저 카테고리를 골라줘!");
    return;
  }

  let name=prompt("물건 이름을 입력해줘!");
  if(!name)return;

  let price=prompt("가격을 입력해줘!");
  if(price===null)return;

  let memo=prompt("메모를 입력해줘! (없으면 취소)");

  let photo=prompt(
    "사진은 다음 단계에서 넣을 수 있어! 지금은 사진 없이 추가할게."
  );

  items.push({
    category:currentCategory,
    name:name,
    price:Number(price)||0,
    memo:memo||"",
    done:false
  });

  localStorage.setItem("myWishlist",JSON.stringify(items));

  showItems();
}

function showItems(){

  let area=document.getElementById("items");

  area.innerHTML="";

  if(!currentCategory){
    area.innerHTML=
      '<div class="empty">카테고리를 눌러서 위시리스트를 시작해봐 🌿</div>';
    return;
  }

  let filtered=items.filter(
    item=>item.category===currentCategory
  );

  let addButton=document.createElement("button");

  addButton.className="action add";
  addButton.textContent="+ 물건 추가하기";
  addButton.onclick=addItem;

  area.appendChild(addButton);

  if(filtered.length===0){

    let empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="아직 담아둔 물건이 없어 🤍";
    area.appendChild(empty);

    return;
  }

  filtered.forEach(item=>{

    let realIndex=items.indexOf(item);

    let box=document.createElement("div");
    box.className="item";

    box.innerHTML=`
      <h3 class="${item.done?"done":""}">
        ${escapeHTML(item.name)}
      </h3>

      <p>💵 ${item.price.toLocaleString()}원</p>

      ${
        item.memo
        ? `<p>📝 ${escapeHTML(item.memo)}</p>`
        : ""
      }

      <button class="action"
        onclick="toggleDone(${realIndex})">
        ${item.done?"구매 완료 취소":"✓ 구매 완료"}
      </button>

      <button class="action delete"
        onclick="deleteItem(${realIndex})">
        🗑 삭제
      </button>
    `;

    area.appendChild(box);
  });
}

function toggleDone(index){

  items[index].done=!items[index].done;

  localStorage.setItem(
    "myWishlist",
    JSON.stringify(items)
  );

  showItems();
}

function deleteItem(index){

  if(!confirm("이 물건을 삭제할까?"))return;

  items.splice(index,1);

  localStorage.setItem(
    "myWishlist",
    JSON.stringify(items)
  );

  showItems();
}

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

updateMoney();
showItems();

</script>

</body>
</html>
