<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY WISHLIST</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f0df;
  color: #304735;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 18px 50px;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: #71806d;
}

.money-card {
  background: #ffffff;
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 5px 18px rgba(50,70,50,.08);
  margin-bottom: 30px;
}

.money-title {
  font-size: 18px;
  font-weight: bold;
}

.money-number {
  font-size: 32px;
  font-weight: bold;
  margin: 8px 0;
}

input {
  border: 1px solid #d5dccd;
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
  outline: none;
  background: #fff;
}

.money-inputs {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.money-inputs input {
  width: 50%;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  background: #7d9b76;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.progress {
  height: 12px;
  background: #e5e8dc;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0 8px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #7d9b76;
  transition: .3s;
}

.goal-text {
  color: #71806d;
  font-size: 14px;
}

h2 {
  margin: 25px 0 15px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.category {
  background: white;
  border-radius: 22px;
  padding: 28px 15px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(50,70,50,.08);
  transition: .2s;
}

.category:hover {
  transform: translateY(-3px);
}

.category-icon {
  font-size: 38px;
  margin-bottom: 10px;
}

#categoryView {
  display: none;
}

.back {
  background: transparent;
  color: #526750;
  padding: 0;
  margin-bottom: 15px;
}

.item-form {
  background: white;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 5px 18px rgba(50,70,50,.08);
}

.item-form input {
  width: 100%;
  margin-bottom: 10px;
}

.item-form button {
  width: 100%;
}

.item-list {
  margin-top: 18px;
}

.item {
  background: white;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 3px 12px rgba(50,70,50,.06);
}

.item-info {
  flex: 1;
}

.item-name {
  font-weight: bold;
}

.item-price {
  color: #71806d;
  margin-top: 4px;
}

.item-memo {
  font-size: 13px;
  color: #929b8d;
  margin-top: 4px;
}

.delete {
  background: #e6b7ae;
  padding: 8px 11px;
}

.empty {
  text-align: center;
  color: #899285;
  padding: 25px;
}

@media (max-width: 600px) {
  .categories {
    grid-template-columns: repeat(2, 1fr);
  }

  h1 {
    font-size: 30px;
  }

  .money-inputs {
    flex-direction: column;
  }

  .money-inputs input {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>MY WISHLIST</h1>
  <div class="subtitle">사고 싶은 것들을 모아두는 곳 🛒</div>
</header>

<div class="money-card">
  <div class="money-title">💰 현재 모은 돈</div>
  <div class="money-number" id="money">0원</div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="goal-text" id="goalText">목표 0원</div>

  <div class="money-inputs">
    <input id="savedInput" type="number" placeholder="현재 모은 돈">
    <input id="goalInput" type="number" placeholder="목표 금액">
    <button onclick="saveMoney()">저장</button>
  </div>
</div>

<div id="categoryList">
  <h2>🛒 카테고리</h2>

  <div class="categories">

    <div class="category" onclick="openCategory('애니메이션')">
      <div class="category-icon">🎬</div>
      애니메이션
    </div>

    <div class="category" onclick="openCategory('아이돌')">
      <div class="category-icon">🎤</div>
      아이돌
    </div>

    <div class="category" onclick="openCategory('책')">
      <div class="category-icon">📚</div>
      책
    </div>

    <div class="category" onclick="openCategory('신발')">
      <div class="category-icon">👟</div>
      신발
    </div>

    <div class="category" onclick="openCategory('옷')">
      <div class="category-icon">👕</div>
      옷
    </div>

    <div class="category" onclick="openCategory('장난감')">
      <div class="category-icon">🧸</div>
      장난감
    </div>

  </div>
</div>

<div id="categoryView">

  <button class="back" onclick="goBack()">← 카테고리로</button>

  <h2 id="categoryTitle"></h2>

  <div class="item-form">
    <input id="itemName" placeholder="사고 싶은 것">
    <input id="itemPrice" type="number" placeholder="가격">
    <input id="itemMemo" placeholder="메모">
    <button onclick="addItem()">＋ 위시리스트에 추가</button>
  </div>

  <div class="item-list" id="itemList"></div>

</div>

</div>

<script>
let currentCategory = "";

let items = JSON.parse(localStorage.getItem("wishlistItems")) || [];

let savedMoney = Number(localStorage.getItem("savedMoney")) || 0;
let goalMoney = Number(localStorage.getItem("goalMoney")) || 0;

function updateMoney() {
  document.getElementById("money").textContent =
    savedMoney.toLocaleString() + "원";

  document.getElementById("goalText").textContent =
    "목표 " + goalMoney.toLocaleString() + "원";

  let percent = goalMoney > 0
    ? Math.min((savedMoney / goalMoney) * 100, 100)
    : 0;

  document.getElementById("progress").style.width = percent + "%";
}

function saveMoney() {
  savedMoney = Number(document.getElementById("savedInput").value) || 0;
  goalMoney = Number(document.getElementById("goalInput").value) || 0;

  localStorage.setItem("savedMoney", savedMoney);
  localStorage.setItem("goalMoney", goalMoney);

  updateMoney();
}

function openCategory(category) {
  currentCategory = category;

  document.getElementById("categoryList").style.display = "none";
  document.getElementById("categoryView").style.display = "block";

  document.getElementById("categoryTitle").textContent = category;

  renderItems();
}

function goBack() {
  document.getElementById("categoryView").style.display = "none";
  document.getElementById("categoryList").style.display = "block";
}

function addItem() {
  const name = document.getElementById("itemName").value.trim();
  const price = Number(document.getElementById("itemPrice").value) || 0;
  const memo = document.getElementById("itemMemo").value.trim();

  if (!name) {
    alert("사고 싶은 것을 입력해줘!");
    return;
  }

  items.push({
    category: currentCategory,
    name: name,
    price: price,
    memo: memo,
    bought: false
  });

  localStorage.setItem("wishlistItems", JSON.stringify(items));

  document.getElementById("itemName").value = "";
  document.getElementById("itemPrice").value = "";
  document.getElementById("itemMemo").value = "";

  renderItems();
}

function renderItems() {
  const list = document.getElementById("itemList");

  const filtered = items.filter(
    item => item.category === currentCategory
  );

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">아직 추가한 위시리스트가 없어!</div>';
    return;
  }

  list.innerHTML = "";

  filtered.forEach((item) => {

    const realIndex = items.indexOf(item);

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <input
        type="checkbox"
        ${item.bought ? "checked" : ""}
        onchange="toggleBought(${realIndex})"
      >

      <div class="item-info">
        <div class="item-name">
          ${escapeHTML(item.name)}
        </div>

        <div class="item-price">
          ${item.price.toLocaleString()}원
        </div>

        ${
          item.memo
          ? `<div class="item-memo">${escapeHTML(item.memo)}</div>`
          : ""
        }
      </div>

      <button class="delete" onclick="deleteItem(${realIndex})">
        삭제
      </button>
    `;

    list.appendChild(div);
  });
}

function toggleBought(index) {
  items[index].bought = !items[index].bought;

  localStorage.setItem(
    "wishlistItems",
    JSON.stringify(items)
  );

  renderItems();
}

function deleteItem(index) {
  items.splice(index, 1);

  localStorage.setItem(
    "wishlistItems",
    JSON.stringify(items)
  );

  renderItems();
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

document.getElementById("savedInput").value = savedMoney || "";
document.getElementById("goalInput").value = goalMoney || "";

updateMoney();
</script>

</body>
</html>
